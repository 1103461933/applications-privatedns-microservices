name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build'
        required: true
        type: choice
        options:
          - booking-service
          - payment-service
          - customer-service
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: true
        type: string
        default: '1.0.0'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev

    strategy:
      matrix:
        service:
          - booking-service
          - payment-service
          - customer-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}  # ← USAR EL PAT EN LUGAR DE GITHUB_TOKEN

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:latest

      - name: Update Helm values (DEV)
        run: |
          SERVICE="${{ matrix.service }}"
          VERSION="${{ steps.version.outputs.version }}"
          VALUES_FILE="services/${SERVICE}/helm/values-dev.yaml"
          
          if [ ! -f "$VALUES_FILE" ]; then
            echo "⚠️  $VALUES_FILE no existe"
            exit 1
          fi
          
          sed -i "s/tag: .*/tag: \"${VERSION}\"/" $VALUES_FILE
          
          echo "✅ Updated ${VALUES_FILE} with tag ${VERSION}"
          cat $VALUES_FILE | grep tag

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git checkout main
          git add services/*/helm/values-dev.yaml
          git commit -m "chore: update images to version ${{ steps.version.outputs.version }} for DEV" || echo "No changes to commit"
          git push origin main