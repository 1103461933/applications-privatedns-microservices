name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - '!services/**/helm/**' # EVITA EL BUCLE INFINITO
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build'
        required: true
        type: choice
        options:
          - booking-service
          - payment-service
          - customer-service
          - all # Añadí esta opción por si quieres relanzar todo manualmente
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: true
        type: string
        default: '1.0.0'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      # Si es manual y no elegiste "all", solo corre el servicio seleccionado
      # Si es push, corre los 3
      matrix:
        service: >-
          ${{ 
            github.event.inputs.service == 'all' || github.event_name == 'push' 
            ? fromJSON('["booking-service", "payment-service", "customer-service"]') 
            : fromJSON(format('["{0}"]', github.event.inputs.service)) 
          }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:latest

  update-helm:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update Helm tags
        run: |
          VERSION="${{ needs.build-and-push.outputs.version }}"
          
          # Si fue manual, solo actualizamos ese servicio. Si fue push, los 3.
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.service }}" != "all" ]; then
            SERVICES=("${{ github.event.inputs.service }}")
          else
            SERVICES=("booking-service" "payment-service" "customer-service")
          fi
          
          for SERVICE in "${SERVICES[@]}"; do
            VALUES_FILE="services/${SERVICE}/helm/values-dev.yaml"
            if [ -f "$VALUES_FILE" ]; then
              sed -i "s/tag: .*/tag: \"${VERSION}\"/" $VALUES_FILE
              echo "✅ Updated ${SERVICE} to ${VERSION}"
            else
              echo "⚠️  $VALUES_FILE no existe, saltando..."
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add services/*/helm/values-dev.yaml
          git commit -m "chore: update images to version ${{ needs.build-and-push.outputs.version }} [skip ci]" || echo "No changes to commit"
          
          # Manejo de concurrencia: si otro job terminó justo antes, rebasamos
          git pull --rebase origin main
          git push origin main