name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - '!services/**/helm/**' # 1. EVITA EL BUCLE: No disparar si el cambio es en Helm
  workflow_dispatch:
    # ... (tus inputs se mantienen igual)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [booking-service, payment-service, customer-service]
    outputs:
      # Guardamos la versión para el siguiente job
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:latest

  update-helm:
    # 2. CONSOLIDACIÓN: Este job corre DESPUÉS de que todos los builds terminen
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update all Helm tags
        run: |
          VERSION="${{ needs.build-and-push.outputs.version }}"
          SERVICES=("booking-service" "payment-service" "customer-service")
          
          for SERVICE in "${SERVICES[@]}"; do
            VALUES_FILE="services/${SERVICE}/helm/values-dev.yaml"
            if [ -f "$VALUES_FILE" ]; then
              sed -i "s/tag: .*/tag: \"${VERSION}\"/" $VALUES_FILE
              echo "✅ Updated ${SERVICE} to ${VERSION}"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add services/*/helm/values-dev.yaml
          # 3. SEGURIDAD: Añadimos [skip ci] al mensaje
          git commit -m "chore: update images to version ${{ needs.build-and-push.outputs.version }} [skip ci]" || echo "No changes to commit"
          
          # Reintento simple en caso de que alguien más haya pusheado algo al mismo tiempo
          git pull --rebase origin main
          git push origin main