name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - '!services/**/helm/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build'
        required: true
        type: choice
        options:
          - booking-service
          - payment-service
          - customer-service
          - all
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: true
        type: string
        default: '1.0.0'

jobs:
  # JOB 1: SETUP - Determinamos servicios y versión
  # Cargamos el ambiente aquí también por si hay variables de entorno específicas
  setup:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      services: ${{ steps.set-services.outputs.services }}
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - id: set-services
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event.inputs.service }}" == "all" ]; then
            echo 'services=["booking-service", "payment-service", "customer-service"]' >> $GITHUB_OUTPUT
          else
            echo 'services=["${{ github.event.inputs.service }}"]' >> $GITHUB_OUTPUT
          fi
      
      - id: set-version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

  # JOB 2: BUILD AND PUSH - Usa matrix para ser rápido
  build-and-push:
    needs: setup
    runs-on: ubuntu-latest
    environment: dev # CARGA DE AMBIENTE PARA DOCKER_USERNAME/PASSWORD
    strategy:
      matrix:
        service: ${{ fromJSON(needs.setup.outputs.services) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ needs.setup.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest

  # JOB 3: UPDATE HELM - Un solo commit final para evitar inconsistencias
  update-helm:
    needs: [setup, build-and-push]
    runs-on: ubuntu-latest
    environment: dev # CARGA DE AMBIENTE PARA EL PAT_TOKEN
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update Helm tags
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          SERVICES_JSON='${{ needs.setup.outputs.services }}'
          
          # jq procesa la lista de servicios que calculamos en el setup
          for SERVICE in $(echo $SERVICES_JSON | jq -r '.[]'); do
            VALUES_FILE="services/${SERVICE}/helm/values-dev.yaml"
            if [ -f "$VALUES_FILE" ]; then
              sed -i "s/tag: .*/tag: \"${VERSION}\"/" $VALUES_FILE
              echo "✅ Updated ${SERVICE} to ${VERSION}"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add services/*/helm/values-dev.yaml
          git commit -m "chore: update images to version ${{ needs.setup.outputs.version }} [skip ci]" || echo "No changes to commit"
          
          # Pull rebase por si otro workflow terminó justo antes
          git pull --rebase origin main
          git push origin main