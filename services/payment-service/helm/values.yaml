replicaCount: 1

image:
  repository: yourusername/payment-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: payment.dev.company.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

configMap:
  enabled: true
  data:
    NODE_ENV: "production"
    LOG_LEVEL: "info"
    SERVICE_NAME: "payment-service"
    SERVICE_VERSION: "1.0.0"
    DB_HOST: "postgres.company.internal"
    DB_PORT: "5432"

serviceAccount:
  create: true
  name: paymentservice-sa
  annotations:
    azure.workload.identity/client-id: "xxx-xxx-xxx"

networkPolicy:
  enabled: false

probes:
  liveness:
    enabled: true
    path: /health/live
    port: 8081
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    enabled: true
    path: /health/ready
    port: 8081
    initialDelaySeconds: 10
    periodSeconds: 5