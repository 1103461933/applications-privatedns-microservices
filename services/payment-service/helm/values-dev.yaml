replicaCount: 1

image:
  repository: yourusername/payment-service
  tag: "d8b1dd4"
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: payment.dev.company.internal
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3

configMap:
  data:
    NODE_ENV: "development"
    LOG_LEVEL: "debug"
    SERVICE_NAME: "payment-service"
    SERVICE_VERSION: "1.0.0"