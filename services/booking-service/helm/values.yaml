replicaCount: 1

image:
  repository: yourusername/booking-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: booking.dev.company.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

configMap:
  enabled: true
  data:
    NODE_ENV: "production"
    LOG_LEVEL: "info"
    SERVICE_NAME: "booking-service"
    SERVICE_VERSION: "1.0.0"
    DB_HOST: "postgres.company.internal"
    DB_PORT: "5432"

serviceAccount:
  create: true
  name: bookingservice-sa
  annotations:
    azure.workload.identity/client-id: "xxx-xxx-xxx"

networkPolicy:
  enabled: false
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: "platform"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: "platform"
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379

probes:
  liveness:
    enabled: true
    path: /health/live
    port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    enabled: true
    path: /health/ready
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5